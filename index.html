<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-950">
    <h1 class="font-bold text-lg text-emerald-400">My Custom AI</h1>
  </header>

  <!-- Chat Area -->
  <main id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
    <div class="bg-gray-800 p-3 rounded-lg border border-gray-700">
      <p class="text-sm font-semibold text-emerald-400">AI Assistant</p>
      <p class="text-sm text-gray-300 mt-1">Hello! I am your personal AI assistant. How can I help you today?</p>
    </div>
  </main>

  <!-- Input Area -->
  <footer class="p-4 bg-gray-950 border-t border-gray-800">
    <div class="max-w-3xl mx-auto flex gap-2">
      <input type="text" id="userInput" placeholder="Ask anything..." class="flex-1 bg-gray-800 text-sm text-white px-4 py-3 rounded-lg border border-gray-700 outline-none focus:border-emerald-500" onkeydown="if(event.key === 'Enter') sendMessage()">
      <button onclick="sendMessage()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-5 py-3 rounded-lg text-sm transition">Send</button>
    </div>
  </footer>

  <script>
    const API_KEY = "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";

    async function sendMessage() {
      const inputField = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const prompt = inputField.value.trim();

      if (!prompt) return;

      chatBox.innerHTML += `
        <div class="bg-emerald-950 border border-emerald-800/50 p-3 rounded-lg ml-8">
          <p class="text-sm font-semibold text-emerald-300">You</p>
          <p class="text-sm text-gray-200 mt-1">${prompt}</p>
        </div>`;
      inputField.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      const loadingDiv = document.createElement('div');
      loadingDiv.className = "bg-gray-800 p-3 rounded-lg border border-gray-700 mr-8";
      loadingDiv.innerHTML = `<p class="text-sm font-semibold text-emerald-400">AI Assistant</p><p class="text-sm text-gray-400 mt-1 animate-pulse">Thinking...</p>`;
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${API_KEY}`,
            "Content-Type": "application/json",
            "HTTP-Referer": window.location.href,
            "X-Title": "My Custom AI"
          },
          body: JSON.stringify({
            model: "google/gemini-2.0-flash-lite-001",
            messages: [{ role: "user", content: prompt }]
          })
        });

        const data = await response.json();

        if (data.error) {
          loadingDiv.querySelector('p:last-child').className = "text-sm text-red-400 mt-1";
          loadingDiv.querySelector('p:last-child').innerText = "API Error: " + (data.error.message || "Invalid Key");
          return;
        }

        const aiMessage = data.choices[0]?.message?.content || "Error getting response.";
        loadingDiv.querySelector('p:last-child').className = "text-sm text-gray-200 mt-1";
        loadingDiv.querySelector('p:last-child').innerText = aiMessage;
      } catch (err) {
        loadingDiv.querySelector('p:last-child').className = "text-sm text-red-400 mt-1";
        loadingDiv.querySelector('p:last-child').innerText = "Network Error. Check console or API key status.";
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
